/* =====================================================
   300 OLAYI TEK LİSTEYE ÇEVİR
   ===================================================== */


let tumOlaylar = [];


olaylar.forEach((grup, kategoriIndex) => {

    grup.forEach((metin, varyasyonIndex) => {

        tumOlaylar.push({

            id:
                kategoriIndex * 10
                + varyasyonIndex
                + 1,

            metin:
                metin

        });

    });

});


/* =====================================================
   BURÇ HESAPLAMA
   ===================================================== */


function burcBul(tarih) {


    const parcalar =
        tarih.split("-");


    const ay =
        Number(parcalar[1]);


    const gun =
        Number(parcalar[2]);


    if (
        (ay === 3 && gun >= 21) ||
        (ay === 4 && gun <= 19)
    )
        return "Koç";


    if (
        (ay === 4 && gun >= 20) ||
        (ay === 5 && gun <= 20)
    )
        return "Boğa";


    if (
        (ay === 5 && gun >= 21) ||
        (ay === 6 && gun <= 20)
    )
        return "İkizler";


    if (
        (ay === 6 && gun >= 21) ||
        (ay === 7 && gun <= 22)
    )
        return "Yengeç";


    if (
        (ay === 7 && gun >= 23) ||
        (ay === 8 && gun <= 22)
    )
        return "Aslan";


    if (
        (ay === 8 && gun >= 23) ||
        (ay === 9 && gun <= 22)
    )
        return "Başak";


    if (
        (ay === 9 && gun >= 23) ||
        (ay === 10 && gun <= 22)
    )
        return "Terazi";


    if (
        (ay === 10 && gun >= 23) ||
        (ay === 11 && gun <= 21)
    )
        return "Akrep";


    if (
        (ay === 11 && gun >= 22) ||
        (ay === 12 && gun <= 21)
    )
        return "Yay";


    if (
        (ay === 12 && gun >= 22) ||
        (ay === 1 && gun <= 19)
    )
        return "Oğlak";


    if (
        (ay === 1 && gun >= 20) ||
        (ay === 2 && gun <= 18)
    )
        return "Kova";


    return "Balık";

}

document

    .addEventListener("change", function() {


        if (this.value) {

            const burc =
                burcBul(this.value);


            document

                .innerText =

        }

    });


/* =====================================================
   SAYI HESAPLAMA
   ===================================================== */


function sayiOlustur(metin) {


    let toplam = 0;


    for (
        let i = 0;
        i < metin.length;
        i++
    ) {

        const kod =
            metin.charCodeAt(i);


        toplam += kod;

    }


    return toplam;

}


/* =====================================================
   TARİH FORMATLA
   ===================================================== */


function tarihFormatla(tarih) {


    const aylar = [

        "Ocak",
        "Şubat",
        "Mart",
        "Nisan",
        "Mayıs",
        "Haziran",
        "Temmuz",
        "Ağustos",
        "Eylül",
        "Ekim",
        "Kasım",
        "Aralık"

    ];


    return (

        tarih.getDate()
        + " "
        + aylar[tarih.getMonth()]
        + " "
        + tarih.getFullYear()

    );

}


/* =====================================================
   ANALİZİ BAŞLAT
   ===================================================== */


function startAnalysis() {


    const isim =
        document
        .getElementById("name")
        .value
        .trim();


    const dogumTarihi =
        document
        .getElementById("birthDate")
        .value;


    if (!isim) {

        alert("Lütfen adınızı girin.");

        return;

    }


    if (!dogumTarihi) {

        alert("Lütfen doğum tarihinizi girin.");

        return;

    }


    const burc =
        burcBul(dogumTarihi);


    document
        .getElementById("start")
        .style.display =
        "none";


    document
        .getElementById("analysis")
        .style.display =
        "block";


    const mesajlar = [

        "Doğum tarihi analiz ediliyor...",

        "Burç çizgisi hesaplanıyor...",

        "İsim analizi gerçekleştiriliyor...",

        "Yaşam çizgisi oluşturuluyor...",

        "Geçmiş dönemler taranıyor...",

        "Önemli dönüm noktaları aranıyor...",

        "300 farklı olay karşılaştırılıyor...",

        "En güçlü eşleşme belirleniyor..."

    ];


    let adim = 0;


    const loadingText =
        document
        .getElementById("loadingText");


    const progressBar =
        document
        .getElementById("progressBar");


    const interval =
        setInterval(() => {


            loadingText.innerText =
                mesajlar[adim];


            progressBar.style.width =
                (
                    (adim + 1)
                    /
                    mesajlar.length
                    *
                    100
                )
                + "%";


            adim++;


            if (
                adim >=
                mesajlar.length
            ) {


                clearInterval(interval);


                setTimeout(() => {


                    sonucGoster(

                        isim,

                        dogumTarihi,

                        burc

                    );


                }, 700);

            }


        }, 650);

}


/* =====================================================
   SONUÇ
   ===================================================== */


function sonucGoster(

    isim,

    dogumTarihi,

    burc

) {


    const simdi =
        new Date();


    /*
       İSİM + DOĞUM TARİHİ + BURÇ
       BİRLİKTE TOHUM OLUŞTURUYOR.
    */


    const isimSayisi =
        sayiOlustur(isim);


    const tarihSayisi =
        sayiOlustur(dogumTarihi);


    const burcSayisi =
        sayiOlustur(burc);


    /*
       BUGÜNÜN TARİHİ
    */


    const bugunSayisi =

        simdi.getFullYear()
        * 10000

        +

        (simdi.getMonth() + 1)
        * 100

        +

        simdi.getDate();


    /*
       ANA TOHUM
    */


    const tohum =

        Math.abs(

            isimSayisi * 31

            +

            tarihSayisi * 17

            +

            burcSayisi * 13

            +

            bugunSayisi * 7

        );


    /*
       300 OLAYDAN BİRİNİ SEÇ
    */


    const olayIndex =

        tohum
        %
        tumOlaylar.length;


    const secilenOlay =

        tumOlaylar[olayIndex];


    /*
       GELECEK TARİH
    */


    const gunFarki =

        30

        +

        (
            tohum * 11
            % 1800
        );


    const gelecekTarih =
        new Date();


    gelecekTarih.setDate(

        gelecekTarih.getDate()
        +
        gunFarki

    );


    /*
       SONUÇ EKRANI
    */


    document
        .getElementById("analysis")
        .style.display =
        "none";


    document
        .getElementById("result")
        .style.display =
        "block";


    document
        .getElementById("personName")
        .innerText =

        isim;


    document
        .getElementById("personZodiac")
        .innerText =

        burc
        +
        " • "
        +
        "Yaşam çizgisi analizi";


    document
        .getElementById("eventDate")
        .innerText =

        tarihFormatla(
            gelecekTarih
        );


    document
        .getElementById("eventTitle")
        .innerText =

        secilenOlay.metin;


    document
        .getElementById("eventDetail")
        .innerText =

        isim
        +
        ", yaşam çizgin üzerinde yapılan analizde "
        +
        burc
        +
        " etkisiyle bağlantılı güçlü bir dönüm noktası tespit edildi. "
        +
        "Bu tarihin senin için neden önemli olacağı zaman içinde ortaya çıkacak.";


}
